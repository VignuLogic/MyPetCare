<html>
<head>
<title>Add Pet - My PetCare</title>

<style>

body{
margin:0;
font-family:Arial;
background:#9ae4ff;
}

/* ===== NAVBAR ===== */

.nav-menu a{
text-decoration:none;
padding:10px 18px;
color:black;
border-radius:6px;
}

.nav-menu a:hover{
background:#ff6a00;
color:white;
}

header{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 60px;
background:white;
}

/* logo */

.logo img{
width:120px;
}

/* nav */

nav{
display:flex;
gap:25px;
}

/* right section */

.right-section{
display:flex;
gap:15px;
align-items:center;
}

.login-btn{
padding:8px 22px;
border:2px solid #ff6600;
border-radius:25px;
background:transparent;
color:#ff6600;
font-weight:600;
cursor:pointer;
}

.login-btn:hover{
background:#ff6600;
color:white;
}

/* ===== PAGE TITLE ===== */

.page-title{
text-align:center;
margin-top:40px;
font-size:28px;
font-weight:bold;
}

/* ===== FORM CARD ===== */

.card{
width:350px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.card h2{
text-align:center;
margin-bottom:20px;
}

/* form fields */

input,select{
width:100%;
padding:10px;
margin:8px 0 18px 0;
border:1px solid #ccc;
border-radius:5px;
}

/* button */

button{
width:100%;
padding:12px;
background:#ff6a00;
border:none;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#e65c00;
}

/* ===== FOOTER ===== */

footer{
margin-top:80px;
background:white;
text-align:center;
padding:20px;
font-size:14px;
}

</style>

</head>

<body>

<!-- ===== NAVBAR ===== -->

<header>

<div class="logo">
<img src="images/logo.png">
</div>

<nav class="nav-menu">
<a href="/">Home</a>
<a href="/grooming">Grooming</a>
<a href="/vaccination">Vaccination</a>
<a href="/care">Care</a>
</nav>

<div class="right-section">
<button class="login-btn">My Account</button>
</div>

</header>

<!-- PAGE TITLE -->

<div class="page-title">
My PetCare
</div>

<!-- ADD PET FORM -->

<div class="card">

<h2>Add Your Pet 🐾</h2>

<form method="POST">

Pet Name <input type="text" name="pet_name" required>

Pet Type <select name="pet_type">

<option>Dog</option>
<option>Cat</option>
<option>Fish</option>
<option>Rabbit</option>
</select>

Age <input type="number" name="age">

<button type="submit">Add Pet</button>

</form>

</div>

<!-- FOOTER -->

<footer>
© 2026 My PetCare | Contact | Privacy
</footer>

</body>
</html>
