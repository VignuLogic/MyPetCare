<html>
    <head>
        <title>Appointment Booking</title>
        <style>
            body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #9ae4ff;
        }

            /* FORM */

.form-section{
width:400px;
margin:50px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#f2a22c;
border:none;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
}
.logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 190px;
        }

        </style>
    </head>

    <body>
        
            <div class="form-section" id="booking">
                <div class="logo">
        <img src="images/LOGO-My PetCare.png" alt="Logo" style="width:300px; height:auto;">
    </div>
<h2>Book Grooming</h2>

<form>

<input type="text" value="{{ user_name }}" name="owner_name" required>
<input type="text" placeholder="Pet Name" required>

<select>
<option>Pet Type</option>
<option>Dog</option>
<option>Cat</option>
<option>Fish</option>
<option>Rabbit</option>
<option>Hamster</option>
</select>

<input type="tel" placeholder="Phone Number">
<label>Appointment Date</label>:<br>
<input type="date" placeholder="Appointment Date">
<label>Appointment Time</label>:<br>
<input type="time" placeholder="Appointment Time">

<input type="text" placeholder="Address" required>
<select>
<option>Select Service</option>
<option>Spa Bath</option>
<option>Full Grooming</option>
<option>Hair Cut</option>
<option>Styling</option>
<option>Anti Tick Treatment</option>
<option>Body Massage</option>

</select>

<button>Book Appointment</button>

</form>

        </body>
    </head>
</html>
