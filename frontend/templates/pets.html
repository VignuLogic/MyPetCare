<html>
<head>
<title>Your Pets - My PetCare</title>

<style>

body{
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fff9f1 0%, #fff1e8 100%);
    min-height: 100vh;
}

/* Page container */
.page-wrapper{
    max-width: 1100px;
    margin: 30px auto 50px;
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 25px;
}

/* Title */
.title{
    text-align: center;
    margin-top: 20px;
    font-size: 2.2rem;
    font-weight: 700;
    color: #ff6b35;
}

/* Add Pet CTA */
.add-btn{
    display: block;
    width: max-content;
    margin: 20px auto;
    padding: 12px 25px;
    background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(255,107,53,0.3);
    transition: all 0.3s ease;
}

.add-btn:hover{
    background: linear-gradient(135deg, #ff5722 0%, #ff7339 100%);
    transform: translateY(-2px);
}

/* Pet cards */
.pets-container{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin: 30px 0;
}

.pet-card{
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 6px 18px rgba(255,107,53,0.15);
    border: 1px solid rgba(255, 107, 53, 0.12);
    text-align: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.pet-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 10px 22px rgba(255,107,53,0.22);
}

.pet-card h3{
    margin: 10px 0;
    color: #ff6b35;
}

.pet-card p{
    margin: 8px 0;
    color: #555;
}

.delete{
    display: inline-block;
    margin-top: 12px;
    color: #d63946;
    text-decoration: none;
    font-weight: 600;
}

.delete:hover{
    text-decoration: underline;
}

@media (max-width: 768px){
    .page-wrapper{
        margin: 20px 10px 30px;
        padding: 20px;
    }

    .title{
        font-size: 1.8rem;
    }

    .add-btn{
        width: 100%;
        text-align: center;
    }
}

</style>
</head>

<body onclick="createParticle(event)">

{% include 'nav.html' %}

<div class="page-wrapper">

<div class="title">
Your Pets 🐾
</div>

<a href="/add_pet" class="add-btn">
Add New Pet
</a>

<div class="pets-container">

{% for pet in pets %}

<div class="pet-card">

<h3>{{ pet.pet_name }}</h3>

<p><b>Type:</b> {{ pet.pet_type }}</p>
<p><b>Age:</b> {{ pet.age }}</p>

<a class="delete" href="/delete_pet/{{ pet.id }}">
Delete
</a>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
