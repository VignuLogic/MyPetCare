<html>
<head>

<title>My Account - PetCare</title>

<style>

/* Page background */
body{
    font-family: Arial;
    background:#f4f4f4;
    margin:0;
}

/* Top header bar */
header{
    background:#2e7d32;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* Dashboard container */
.container{
    width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

/* Feature cards */
.card{
    background:#fafafa;
    padding:20px;
    margin-top:20px;
    border-radius:8px;
    border:1px solid #eee;
}

/* Buttons */
button{
    padding:10px 20px;
    background:#f2a22c;
    border:none;
    cursor:pointer;
    color:white;
    border-radius:5px;
}

button:hover{
    background:#d88917;
}

</style>

</head>

<body>

<header>

<h2>My PetCare Dashboard</h2>

<a href="/logout" style="color:white; text-decoration:none;">Logout</a>

</header>


<div class="container">

<!-- Logged-in user -->
<h3>Welcome {{ user_name }} </h3>


<!-- Add Pet -->
<div class="card">

<h4>Add New Pet</h4>

<a href="/add_pet">
<button>Add Pet</button>
</a>

</div>


<!-- Pets List -->
<div class="card">

<h4>Your Pets</h4>

<p>Pet list will appear here.</p>

</div>


<!-- Grooming -->
<div class="card">

<h4>Book Grooming</h4>

<a href="/grooming">
<button>Book Grooming</button>
</a>

</div>


<!-- Vaccination -->
<div class="card">

<h4>Vaccination Tracker</h4>

<a href="/vaccination">
<button>View Vaccination</button>
</a>

</div>


</div>

</body>
</html>
