
<html>
<head>
    <title>Signup</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffc198;
        }

        .popup {
            width: 500px;
            background: #fff;
            margin: 50px auto;
            padding: 40px;
            border-radius: 8px;
            position: relative;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 120px;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .mobile-container {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .terms {
            font-size: 13px;
            margin-top: 20px;
            color: #555;
        }

        .btn {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background-color:#ffc198;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #d99;
        }
    </style>
</head>
<body onclick="createParticle(event)">
<div class="popup">
    <div class="logo">
        <img src="images/LOGO-My PetCare.png" alt="Logo">
    </div>

    <h2>Sign up to The PetCare account</h2>

    <form action="/signup" method="POST">

        <label>First Name*</label>
        <input type="text" name="first_name" placeholder="Enter your first name" required>

        <label>Last Name*</label>
        <input type="text" name="last_name" placeholder="Enter your last name" required>

        <label>Mobile Number*</label>
        <div class="mobile-container">
            <div class="country-code">+91</div>
            <input type="number" name="mobile" placeholder="Enter mobile number" required>
        </div>

        <label>Email*</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password*</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <div class="terms">
            By creating a PetCare account, you agree to the Terms & Conditions.
        </div>

        <button type="submit" class="btn">Create Account</button>

        <div style="text-align:center; margin-top:15px; text-decoration: none;">
            Already have an account?
            <a href="/login" style="text-decoration: none;">Login</a>
        </div>

    </form>
</div>
</body>
</html>
